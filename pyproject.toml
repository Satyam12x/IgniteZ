[project]
name = "greenfleet"
version = "0.1.0"
description = "Quantum-inspired fuel consumption prediction and green fleet optimization (SIH 2026, PS SIH26138)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# Phase 3 (optimizer + baselines). Installed later to keep the Phase 1 env light.
optim = [
    "pymoo>=0.6",
    "ortools>=9.9",
    "scipy>=1.12",
]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.20",
]
# Phase 4 (decision-support platform): API + dashboard. httpx is the test client.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "plotly>=5.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenfleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running (benchmarks, 30-seed runs)",
    "network: requires internet access",
    "edgecase: covers a named physical or data edge case",
    "integration: runs against real downloaded data",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["UP031"]
