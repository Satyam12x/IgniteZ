# Controlled vocabulary for vessel classes (D-12) plus per-class physical reference
# values used by the physics core.
#
# Two jobs:
#
# 1. Map every label a data source might use onto one canonical class. EMSA itself
#    drifts: "Passenger ship (Cruise Passenger ship)" appears only from 2023 and
#    "Other ship types (Offshore)" only from 2024, both as refinements of labels
#    already in use. Unknown labels map to `other` with a warning, never silently.
#
# 2. Supply the reference operating point the physics core needs. MRV cannot
#    identify the speed-fuel relationship (see docs/FINDINGS_PHASE1.md §2), so the
#    speed response is imposed from naval architecture and anchored at a per-class
#    typical service speed. These are published typical values, not fitted, and are
#    tagged provisional accordingly.
#
# Units:
#   typical_service_speed_kn   knots, at normal sea-going service condition
#   aux_load_share             fraction of total at-sea power that does NOT scale
#                              with speed (auxiliaries, hotel, reefer, cargo plant)
#   in_mrv_scope               whether ships of this class appear in EU MRV at all

meta:
  schema_version: 1
  source_speeds: >
    Typical published service speeds by vessel class, consistent with the vessel
    classes used in the IMO Fourth GHG Study 2020. Indicative class values only:
    real service speed varies strongly with size within a class, especially for
    container ships.
  confidence_speeds: provisional
  source_aux: >
    Indicative auxiliary and hotel load shares by class. Reefer and passenger
    classes are high because refrigeration and hotel load are large and roughly
    speed-independent.
  confidence_aux: provisional

classes:

  bulk_carrier:
    display_name: "Bulk carrier"
    typical_service_speed_kn: 14.0
    aux_load_share: 0.06
    in_mrv_scope: true
    aliases: ["Bulk carrier", "bulker", "BC", "Bulk Carrier"]

  oil_tanker:
