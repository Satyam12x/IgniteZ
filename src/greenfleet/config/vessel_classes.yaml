    aux_load_share: 0.12
    in_mrv_scope: true
    aliases: ["Other ship types", "Other", "other", "Unknown"]

  # ---- classes NOT present in EU MRV -------------------------------------
  # Harbour tugs are roughly 200-500 GT, far below the 5000 GT MRV threshold, so
  # no tug appears anywhere in the training data. They are reached through the
  # cold-start physics path (P-05) and every tug figure is labelled
  # physics-derived, never data-derived. These are the GTTP / Mormugao classes.

  harbour_tug:
    display_name: "Harbour tug"
    typical_service_speed_kn: 11.0
    # A tug spends most of its duty cycle pushing at near-zero speed, where
    # bollard-pull thrust rather than free-running resistance sets the power.
    # The speed-cubed term therefore describes only the transit phase, and the
    # duty-cycle model in the tug module handles the rest.
    aux_load_share: 0.15
    in_mrv_scope: false
    aliases: ["Harbour tug", "tug", "Tug", "harbour tug"]

  escort_tug:
    display_name: "Escort / terminal tug"
    typical_service_speed_kn: 12.0
    aux_load_share: 0.15
    in_mrv_scope: false
    aliases: ["Escort tug", "Terminal tug", "escort tug"]
