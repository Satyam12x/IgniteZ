    # quantum technology agreement with this port authority, and it runs India's
    # first green ship incentive scheme.
    is_demo_site: true
    green_hydrogen_hub: false
    gttp_port: false
    shore_power:
      status: {2024: planned, 2028: available}
      max_mw: 4.0
      confidence: provisional
    fuel_availability:
